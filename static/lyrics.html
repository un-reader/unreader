<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search and read song lyrics from LRCLIB.">
  <title>Un-Reader Lyrics</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="bbs.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <script src="common.js"></script>
  <style>
    * { box-sizing: border-box; transition: none !important; animation: none !important; }
    .window { min-height: 0; }
    .title-bar { flex-shrink: 0; }
    #back-btn { text-decoration: none; color: var(--text-color); }
    main { flex: 1; min-height: 0; width: 100%; padding: 8px; overflow-y: auto; }
    .intro { margin: 0 0 12px; font-size: 13px; }
    label { display: block; margin: 8px 0 4px; font-size: 12px; font-weight: bold; }
    .search-row { display: flex; align-items: stretch; }
    input, button { min-height: 40px; border: var(--border); border-radius: 0; font: 14px Arial, sans-serif; }
    input { flex: 1; min-width: 0; padding: 8px; }
    button { padding: 6px 12px; color: var(--text-color); background: var(--bg-color); box-shadow: 2px 2px 0 var(--text-color); font-weight: bold; cursor: pointer; }
    .search-row button { margin-left: 8px; }
    button:disabled { opacity: .55; box-shadow: none; }
    button:active:not(:disabled) { color: var(--bg-color); background: var(--text-color); }
    #status { min-height: 22px; margin: 10px 0; font-size: 12px; }
    #results { margin: 0; padding: 0; list-style: none; }
    .result { margin: 0 0 8px; }
    .result button { display: block; width: 100%; text-align: left; }
    .result-title { display: block; margin-bottom: 3px; }
    .result-meta { display: block; font-size: 12px; font-weight: normal; }
    #reader { margin-top: 14px; border: var(--border); box-shadow: 2px 2px 0 var(--text-color); }
    #reader[hidden] { display: none; }
    .reader-head { padding: 10px; border-bottom: var(--border); }
    .reader-head h2 { margin: 0 0 4px; font-size: 17px; }
    .reader-meta { font-size: 12px; }
    #back-to-results { min-height: 40px; margin-top: 8px; }
    .lyric-controls { padding: 8px 10px 0; }
    .lyric-controls button { min-height: 40px; margin: 0 6px 4px 0; }
    .lyric-controls button[aria-pressed="true"] { color: var(--bg-color); background: var(--text-color); }
    #lyrics { margin: 0; padding: 12px; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; font: 14px/1.5 Arial, Verdana, sans-serif; }
    .credit { margin: 12px 0 0; font-size: 11px; }
    .credit a { color: var(--text-color); }
    @media (max-width: 420px) {
      .title-text { margin-left: 72px; font-size: 13px; }
      .search-row { display: block; }
      .search-row button { width: 100%; margin: 8px 0 0; }
    }
  </style>
</head>
<body>
  <div class="window">
    <header class="title-bar">
      <div class="title-stripes" aria-hidden="true"></div>
      <a id="back-btn" class="paper-btn" href="index.html">◀ HOME</a>
      <div class="title-text">LYRICS</div>
    </header>
    <main>
      <p class="intro">Search song titles, artists, or albums, then choose a result to read its lyrics.</p>
      <form id="search-form">
        <label for="search-query">Song or artist</label>
        <div class="search-row">
          <input class="paper-input" id="search-query" type="search" maxlength="160" autocomplete="off" required>
          <button class="paper-btn shadow" id="search-button" type="submit">SEARCH</button>
        </div>
      </form>
      <div id="status" role="status" aria-live="polite">Search lyrics from LRCLIB.</div>
      <section id="reader" aria-live="polite" hidden>
        <div class="reader-head">
          <h2 id="track-title"></h2>
          <div id="track-meta" class="reader-meta"></div>
          <button class="paper-btn shadow" id="back-to-results" type="button">BACK TO RESULTS</button>
        </div>
        <div class="lyric-controls" aria-label="Lyrics format">
          <button class="paper-btn shadow" id="plain-button" type="button" aria-pressed="true">PLAIN</button>
          <button class="paper-btn shadow" id="synced-button" type="button" aria-pressed="false">SYNCED</button>
        </div>
        <pre id="lyrics"></pre>
      </section>
      <ul id="results" aria-label="Lyrics search results"></ul>
      <p class="credit">Lyrics provided by <a href="https://lrclib.net" target="_blank" rel="noopener noreferrer">LRCLIB</a>.</p>
    </main>
  </div>
  <script>
    (function () {
      var form = document.getElementById('search-form');
      var queryInput = document.getElementById('search-query');
      var searchButton = document.getElementById('search-button');
      var status = document.getElementById('status');
      var results = document.getElementById('results');
      var reader = document.getElementById('reader');
      var plainButton = document.getElementById('plain-button');
      var syncedButton = document.getElementById('synced-button');
      var activeRecord = null;
      var retryAt = 0;
      var lastRequestAt = 0;
      var requestInProgress = false;

      function setStatus(message) {
        status.textContent = message;
      }

      function trackDuration(seconds) {
        if (!seconds || seconds < 1) return '';
        var minutes = Math.floor(seconds / 60);
        var remaining = Math.floor(seconds % 60);
        return minutes + ':' + (remaining < 10 ? '0' : '') + remaining;
      }

      function showLyrics(useSynced) {
        if (!activeRecord) return;
        var plain = activeRecord.plainLyrics || '';
        var synced = activeRecord.syncedLyrics || '';
        var useSyncedLyrics = (useSynced && !!synced) || (!plain && !!synced);
        var text = useSyncedLyrics ? synced : plain;
        document.getElementById('lyrics').textContent = text || (activeRecord.instrumental ? 'This track is instrumental.' : 'No lyrics are available for this result.');
        plainButton.setAttribute('aria-pressed', useSyncedLyrics ? 'false' : 'true');
        syncedButton.setAttribute('aria-pressed', useSyncedLyrics ? 'true' : 'false');
        plainButton.disabled = !plain;
        syncedButton.disabled = !synced;
      }

      function openRecord(record) {
        activeRecord = record;
        document.getElementById('track-title').textContent = record.trackName || record.name || 'Untitled track';
        var details = record.artistName || 'Unknown artist';
        if (record.albumName) details += ' - ' + record.albumName;
        var duration = trackDuration(record.duration);
        if (duration) details += ' (' + duration + ')';
        document.getElementById('track-meta').textContent = details;
        reader.hidden = false;
        showLyrics(false);
        reader.scrollIntoView(true);
      }

      function addResult(record) {
        var item = document.createElement('li');
        var button = document.createElement('button');
        var title = document.createElement('span');
        var meta = document.createElement('span');
        item.className = 'result';
        title.className = 'result-title';
        meta.className = 'result-meta';
        title.textContent = record.trackName || record.name || 'Untitled track';
        meta.textContent = (record.artistName || 'Unknown artist') + (record.instrumental ? ' - instrumental' : record.syncedLyrics ? ' - synced lyrics' : ' - plain lyrics');
        button.type = 'button';
        button.className = 'paper-btn shadow';
        button.appendChild(title);
        button.appendChild(meta);
        button.onclick = function () { openRecord(record); };
        item.appendChild(button);
        results.appendChild(item);
      }

      form.onsubmit = function (event) {
        event.preventDefault();
        var query = queryInput.value.trim();
        if (!query || requestInProgress) return;
        var wait = retryAt - Date.now();
        if (wait > 0) {
          setStatus('Please wait ' + Math.ceil(wait / 1000) + ' seconds before searching again.');
          return;
        }

        requestInProgress = true;
        searchButton.disabled = true;
        results.textContent = '';
        reader.hidden = true;
        setStatus('Searching LRCLIB...');

        var delay = Math.max(0, 250 - (Date.now() - lastRequestAt));
        window.setTimeout(function () {
          var request = new XMLHttpRequest();
          request.open('GET', 'https://lrclib.net/api/search?q=' + encodeURIComponent(query), true);
          request.setRequestHeader('X-User-Agent', 'UnReader Lyrics/1.0 (https://github.com/un-reader/unreader)');
          request.timeout = 15000;
          lastRequestAt = Date.now();
          request.onreadystatechange = function () {
            if (request.readyState !== 4) return;
            requestInProgress = false;
            searchButton.disabled = false;
            if (request.status === 429) {
              var retrySeconds = Number(request.getResponseHeader('Retry-After')) || 60;
              retryAt = Date.now() + retrySeconds * 1000;
              setStatus('LRCLIB rate limit reached. Please wait ' + retrySeconds + ' seconds before searching again.');
              return;
            }
            if (request.status < 200 || request.status >= 300) {
              setStatus(request.status === 0 ? 'Could not reach LRCLIB. Check your connection and try again.' : 'LRCLIB could not complete the search (' + request.status + ').');
              return;
            }
            var rows;
            try { rows = JSON.parse(request.responseText); } catch (error) { rows = null; }
            if (!Array.isArray(rows)) {
              setStatus('LRCLIB returned an unexpected response.');
              return;
            }
            rows.forEach(addResult);
            setStatus(rows.length ? rows.length + ' result' + (rows.length === 1 ? '' : 's') + '. Select one to read the lyrics.' : 'No matching tracks found.');
          };
          request.onerror = function () {
            requestInProgress = false;
            searchButton.disabled = false;
            setStatus('Could not reach LRCLIB. Check your connection and try again.');
          };
          request.ontimeout = request.onerror;
          request.send();
        }, delay);
      };

      plainButton.onclick = function () { showLyrics(false); };
      syncedButton.onclick = function () { showLyrics(true); };
      document.getElementById('back-to-results').onclick = function () {
        results.scrollIntoView(true);
      };
    })();
  </script>
</body>
</html>
