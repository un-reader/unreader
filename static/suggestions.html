<!doctype html>
<html lang="en">
<head>
  <script src="neko-loader.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>un-reader BBS - Suggestions</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="bbs.css" />
  <style type="text/css">
    .window { width: 98vw; max-width: 800px; height: 95vh; min-height: 0; box-sizing: border-box; }
    .window *, .window *:before, .window *:after { box-sizing: border-box; }
    .form-box { margin: 15px; border: var(--border); padding: 15px; background: white; box-shadow: 2px 2px 0px black; }
    .kindle-input { display: block; width: 100%; border: var(--border); background: white; color: black; padding: 8px; font-family: monospace; font-size: 13px; margin-bottom: 12px; }
    textarea.kindle-input { resize: vertical; min-height: 80px; }
    .submit-btn { width: 100%; padding: 10px; font-size: 13px; font-weight: bold; cursor: pointer; }

    .suggestions-feed { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; margin: 0 15px 15px; overflow: hidden; }
    .suggestion-card { border: var(--border); padding: 12px; margin-bottom: 12px; background: white; box-shadow: 2px 2px 0px black; }
    .card-header { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; color: #555; border-bottom: 1px dashed black; padding-bottom: 4px; margin-bottom: 8px; text-transform: uppercase; }
    .card-title { font-weight: bold; font-size: 14px; margin: 0 0 6px 0; }
    .card-desc { font-size: 13px; line-height: 1.3; white-space: pre-wrap; color: black; }
    .status-msg { font-size: 12px; font-weight: bold; text-align: center; margin: 10px 0; display: none; padding: 5px; border: 1px dashed black; }

    #pagination-bar { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin: 0 0 10px; }
    #feed-container { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

    .staff-banner { margin: 0 15px 10px 15px; padding: 6px; border: 3px solid #0000ff; box-shadow: 2px 2px 0px #0000ff50; font-size: 11px; font-weight: bold; text-transform: uppercase; display: none; }
    .card-status { display: inline-block; font-size: 10px; font-weight: bold; text-transform: uppercase; border: 2px solid black; padding: 2px 6px; margin-bottom: 6px; background: black; color: white; }
    .card-done { display: inline-block; font-size: 10px; font-weight: bold; text-transform: uppercase; border: 2px solid black; padding: 2px 6px; margin-bottom: 6px; background: repeating-linear-gradient(45deg, #000, #000 4px, #fff 4px, #fff 8px); color: black; }
    .suggestion-card.completed .card-desc { text-decoration: line-through; color: #666; }
    .card-actions { margin-top: 8px; display: flex; flex-wrap: wrap; }
    .card-actions .paper-btn { font-size: 10px; padding: 4px 8px; }
    .card-actions .paper-btn + .paper-btn { margin-left: 6px; }
    .card-meta { font-size: 9px; color: #777; font-family: monospace; }
    .suggestion-comments { margin-top: 10px; border-top: 1px dashed #888; padding-top: 8px; }
    .suggestion-comments-title { font-size: 11px; font-weight: bold; margin-bottom: 6px; }
    .suggestion-comment { font-size: 12px; padding: 5px 0; border-bottom: 1px dotted #bbb; }
    .suggestion-comment-head { color: #555; font-size: 10px; font-weight: bold; margin-bottom: 3px; }
    .suggestion-comment-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .suggestion-comment-input { min-height: 48px !important; margin: 6px 0 !important; }
    .suggestion-comment-status { font-size: 11px; margin-left: 6px; }

    @media (max-width: 480px) {
      .form-box { margin: 8px; padding: 10px; }
      .suggestions-feed { margin: 0 8px 8px; }
      #pagination-bar { margin-bottom: 8px; }
      .suggestion-card { padding: 8px; }
    }
    @media (max-height: 520px) {
      .form-box { margin-top: 6px; margin-bottom: 6px; padding: 8px; }
      textarea.kindle-input { min-height: 48px; }
    }
  </style>
  <script src="common.js"></script>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <div class="title-stripes"></div>
      <button class='paper-btn' id="back-btn" onclick="window.location.href='index.html'">&lt; HOME</button>
      <div class="title-text">SUGGESTIONS</div>
    </div>

    <div class="staff-banner" id="staff-banner">STAFF MODE: You can tag suggestions with a status and notes.</div>

    <div class="form-box">
      <div style="font-weight: bold; margin-bottom: 4px; font-size: 11px;">APPLICATION NAME:</div>
      <input type="text" id="idea-title" class="kindle-input paper-input" placeholder="e.g., Mail Client, Snake Game..." autocomplete="off" />

      <div style="font-weight: bold; margin-bottom: 4px; font-size: 11px;">CONCEPT DESCRIPTION:</div>
      <textarea id="idea-desc" class="kindle-input paper-input" placeholder="Explain what this app would do..."></textarea>

      <button id="idea-submit" class="paper-btn submit-btn">POST SUGGESTION</button>
      <div id="status-log" class="status-msg"></div>
    </div>

    <div class="suggestions-feed">
      <div id="pagination-bar">
        <button class="paper-btn" onclick="jumpPage(-1)">&lt; NEWER</button>
        <span id="page-display-index" style="font-family: monospace; font-weight: bold;">PAGE: 0</span>
        <button class="paper-btn" onclick="jumpPage(1)">OLDER &gt;</button>
      </div>
      <div id="feed-container"></div>
    </div>
  </div>

  <script type="text/javascript">
    var token = localStorage.getItem("token") || localStorage.getItem("unreader-token");
    var myUsername = localStorage.getItem("username");
    var currentHistoryIndex = 0;
    var currentPageSize = 0;
    var viewer = { username: "", isAdmin: false, isStaff: false };

    function getPageSize() {
      var feed = document.getElementById("feed-container");
      var estimatedCardHeight = window.innerWidth < 480 ? 220 : 180;
      return Math.max(1, Math.min(30, Math.ceil(feed.clientHeight / estimatedCardHeight) + 1));
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function decodeEntities(str) {
      var text = document.createElement("textarea");
      text.innerHTML = String(str == null ? "" : str);
      return text.value;
    }

    function setStatus(msg) {
      var el = document.getElementById("status-log");
      el.textContent = msg;
      el.style.display = "block";
    }

    if (!token || !myUsername) {
      setStatus("Guest Mode: Please log in via Chat/Dashboard to submit ideas.");
      document.getElementById("idea-title").disabled = true;
      document.getElementById("idea-desc").disabled = true;
      document.getElementById("idea-submit").disabled = true;
    }

    // Staff status from the server; the server re-checks every mutating request.
    fetch(BACKEND_URL + "/api/portal2d/me", {
      headers: { Authorization: "Bearer " + token },
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d) {
          viewer = { username: d.username, isAdmin: !!d.isAdmin, isStaff: !!d.isStaff };
          if (viewer.isStaff) document.getElementById("staff-banner").style.display = "block";
        }
        loadHistory();
      })
      .catch(function () { loadHistory(); });

    function jumpPage(val) {
      currentHistoryIndex = Math.max(0, currentHistoryIndex + val);
      loadHistory();
    }

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var nextPageSize = getPageSize();
        if (nextPageSize !== currentPageSize) {
          currentHistoryIndex = 0;
          loadHistory();
        }
      }, 150);
    });

    function api(method, path, body) {
      return fetch(BACKEND_URL + path, {
        method: method,
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: body === undefined ? undefined : JSON.stringify(body),
      }).then(function (r) {
        return r.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) {}
          if (!r.ok) {
            throw new Error(data && data.error ? data.error : (r.status === 404 ? "Not found (404) — server is running old code" : "Request failed (" + r.status + ")"));
          }
          if (data === null) throw new Error("Bad server response (" + r.status + ")");
          return data;
        });
      });
    }

    // GET HISTORY VIA THE SUGGESTIONS TABLE ENDPOINT
    function loadHistory() {
      var container = document.getElementById("feed-container");
      currentPageSize = getPageSize();
      if (!token) {
        container.innerHTML = '<div style="font-size:12px; font-family:monospace; font-style:italic; text-align:center;">Log in to read the suggestions feed.</div>';
        return;
      }
      container.innerHTML = '<div style="font-size:12px; font-family:monospace; font-style:italic;">Querying BBS databanks...</div>';

      api("GET", "/suggestions-history?index=" + currentHistoryIndex + "&limit=" + currentPageSize)
        .then(function (data) {
          document.getElementById("page-display-index").textContent = "PAGE: " + currentHistoryIndex;
          container.innerHTML = "";

          if (!data.length) {
            container.innerHTML = '<div style="font-size:12px; font-family:monospace; font-style:italic; text-align:center;">No custom app ideas found on this page.</div>';
            return;
          }

          for (var i = data.length - 1; i >= 0; i--) {
            container.appendChild(renderCard(data[i]));
          }
        })
        .catch(function (err) {
          container.innerHTML = '<div style="font-size:12px; color:red; font-family:monospace;">Could not retrieve stream: ' + escapeHtml(err.message) + '</div>';
        });
    }

    function renderCard(post) {
      var card = document.createElement("div");
      card.className = "suggestion-card" + (post.completion === true ? " completed" : "");

      var raw = String(post.suggestions || "");
      var lines = raw.split("\n");
      var title = (lines[0] || "Untitled Concept").trim();
      var desc = lines.slice(1).join("\n").trim() || "No explanation provided.";
      var dateDisplay = post.date || "Unknown";
      var isOwner = post.username === viewer.username;

      var html =
        '<div class="card-header">' +
          '<div>@' + escapeHtml(post.username || "anonymous") + '</div>' +
          '<div>' + escapeHtml(dateDisplay) + '</div>' +
        '</div>' +
          '<div class="card-title">' + escapeHtml(title) + '</div>';

      if (post.completion === true) {
        html += '<div class="card-done">COMPLETED</div>';
      }
      if (post.admin_filter) {
        html += '<div class="card-status">STATUS: ' + escapeHtml(decodeEntities(post.admin_filter)) + '</div>';
      }
      html += '<div class="card-desc">' + escapeHtml(desc) + '</div>';
      html += '<div class="card-meta">#' + post.id + '</div>';

      var comments = Array.isArray(post.comments) ? post.comments : [];
      html += '<div class="suggestion-comments"><div class="suggestion-comments-title">COMMENTS (' + comments.length + ')</div>';
      for (var c = 0; c < comments.length; c++) {
        var comment = comments[c];
        var commentDate = comment.created_at ? new Date(Number(comment.created_at)).toLocaleString() : "";
        html += '<div class="suggestion-comment"><div class="suggestion-comment-head">@' + escapeHtml(comment.username || "anonymous") + (commentDate ? ' &bull; ' + escapeHtml(commentDate) : '') + '</div><div class="suggestion-comment-body">' + escapeHtml(comment.content) + '</div></div>';
      }
      if (token) {
        html += '<textarea class="kindle-input paper-input suggestion-comment-input" maxlength="2000" aria-label="Comment on suggestion #' + post.id + '" placeholder="Write a comment..."></textarea><button class="paper-btn suggestion-comment-submit">POST COMMENT</button><span class="suggestion-comment-status" aria-live="polite"></span>';
      }
      html += '</div>';

      var actions = [];
      if (viewer.isStaff) {
        actions.push('<button class="paper-btn" onclick="tagSuggestion(' + post.id + ')">SET STATUS</button>');
        if (post.completion === true) {
          actions.push('<button class="paper-btn" onclick="completeSuggestion(' + post.id + ', false)">MARK NOT DONE</button>');
        } else {
          actions.push('<button class="paper-btn" onclick="completeSuggestion(' + post.id + ', true)">MARK DONE</button>');
        }
        if (post.admin_filter || post.completion !== null) {
          actions.push('<button class="paper-btn" onclick="clearSuggestion(' + post.id + ')">CLEAR TAGS</button>');
        }
      }
      if (isOwner || viewer.isStaff) {
        actions.push('<button class="paper-btn" onclick="deleteSuggestion(' + post.id + ')">DELETE</button>');
      }
      if (actions.length) {
        html += '<div class="card-actions">' + actions.join("") + '</div>';
      }

      card.innerHTML = html;
      card.querySelector('.card-header > div').prepend(createProfilePicture(post.image_data));
      var commentButton = card.querySelector('.suggestion-comment-submit');
      if (commentButton) {
        commentButton.onclick = function () { postSuggestionComment(post.id, card); };
      }
      return card;
    }

    async function postSuggestionComment(id, card) {
      var input = card.querySelector('.suggestion-comment-input');
      var status = card.querySelector('.suggestion-comment-status');
      var button = card.querySelector('.suggestion-comment-submit');
      var content = input.value.trim();
      if (!content) { status.textContent = 'Enter a comment first.'; return; }
      button.disabled = true;
      status.textContent = 'Posting...';
      try {
        await api('POST', '/api/suggestions/' + id + '/comments', { content: content });
        loadHistory();
      } catch (err) {
        status.textContent = 'Failed: ' + err.message;
        button.disabled = false;
      }
    }

    async function tagSuggestion(id) {
      var value = await unPrompt("New status tag for #" + id + " (empty to clear):", "");
      if (value === null) return;
      await patchSuggestion(id, { admin_filter: value.trim() || null });
    }

    async function completeSuggestion(id, done) {
      await patchSuggestion(id, { completion: done });
    }

    async function clearSuggestion(id) {
      var ok = await unConfirm("Clear status and completion flag on #" + id + "?");
      if (!ok) return;
      await patchSuggestion(id, { admin_filter: null, completion: null });
    }

    // Sends only the changed field; the server keeps the other one untouched.
    async function patchSuggestion(id, changes) {
      try {
        await api("PUT", "/api/suggestions/" + id, changes);
        setStatus("Suggestion #" + id + " updated.");
        loadHistory();
      } catch (err) {
        setStatus("Update failed: " + err.message);
      }
    }

    async function deleteSuggestion(id) {
      var ok = await unConfirm("Delete suggestion #" + id + " permanently?");
      if (!ok) return;
      try {
        await api("DELETE", "/api/suggestions/" + id);
        setStatus("Suggestion #" + id + " deleted.");
        loadHistory();
      } catch (err) {
        setStatus("Delete failed: " + err.message);
      }
    }

    document.getElementById("idea-submit").onclick = function () {
      var titleInp = document.getElementById("idea-title");
      var descInp = document.getElementById("idea-desc");

      var title = titleInp.value.trim();
      var desc = descInp.value.trim();

      if (!title || !desc) {
        setStatus("Error: Input fields cannot be blank.");
        return;
      }
      if (!token) {
        setStatus("Error: You must be logged in to post.");
        return;
      }

      api("POST", "/api/suggestions", { title: title, body: desc })
        .then(function () {
          titleInp.value = "";
          descInp.value = "";
          setStatus("Idea successfully sent!");
          currentHistoryIndex = 0;
          loadHistory();
        })
        .catch(function (err) {
          setStatus("Failed: " + err.message);
        });
    };
  </script>
</body>
</html>
