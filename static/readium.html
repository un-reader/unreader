<!doctype html>
<html lang="en">
  <head>
    <script src="neko-loader.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readium!</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="bbs.css" />
    <script src="common.js"></script>
    <style>
      * { box-sizing: border-box; transition: none !important; animation: none !important; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { align-items: stretch; justify-content: stretch; }
      .window { min-height: 0; }
      .title-bar { flex-shrink: 0; }
      #back-btn { text-decoration: none; color: var(--text-color); }
      main { display: flex; flex: 1; min-width: 0; min-height: 0; width: 100%; overflow: hidden; }
      iframe { display: block; flex: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; border: 0; background: var(--bg-color); }
    </style>
  </head>
  <body>
    <div class="window">
      <header class="title-bar">
        <div class="title-stripes" aria-hidden="true"></div>
        <a id="back-btn" class="paper-btn" href="index.html">◀ HOME</a>
        <div class="title-text">READIUM!</div>
      </header>
      <main>
        <iframe src="https://readium.ink/" title="Readium!"></iframe>
      </main>
    </div>
    <script>startRichPresence('readium');</script>
  </body>
</html>
